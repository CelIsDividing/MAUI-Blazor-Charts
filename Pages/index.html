<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAUI Blazor Charts</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="MauiBlazorCharts.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40" cx="50" cy="50"></circle>
            <circle r="40" cx="50" cy="50"></circle>
        </svg>
        <div class="loading-progress-text"><p>Učitavanje aplikacije...</p></div>
    </div>

    <div id="blazor-error-ui">
        Došlo je do greške u aplikaciji.
        <a href="" class="reload">Osvežite</a>
        <a class="dismiss">✖</a>
    </div>

    <script src="_framework/blazor.web.js"></script>
</body>

</html>

<style>
    html, body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    code {
        color: #C23030
    }

    .ok {
        color: #34A853
    }

    .loading-progress {
        position: relative;
        display: block;
        width: 80px;
        height: 80px;
        margin: 20vh auto 1em auto;
    }

        .loading-progress circle {
            fill: none;
            stroke: #E3165B;
            stroke-width: 4px;
            stroke-dasharray: 125.6 / 2 125.6 / 2;
            stroke-dashoffset: -62.8;
            stroke-linecap: round;
            animation: progress-animation 2s infinite linear;
        }

            .loading-progress circle:nth-child(2) {
                stroke: #46B881;
                animation-delay: -1s;
            }

    @keyframes progress-animation {
        from {
            stroke-dashoffset: 549.78;
        }

        to {
            stroke-dashoffset: 0;
        }
    }

    .loading-progress-text {
        text-align: center;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

        .loading-progress-text p {
            margin: 0;
            font-weight: 700;
            font-size: 1.3rem;
            color: #555;
        }

    #blazor-error-ui {
        background: lightyellow;
        bottom: 0;
        box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.2);
        display: none;
        left: 0;
        padding: 0.6rem 1.25rem 0.7rem 1.0rem;
        position: fixed;
        right: 0;
        z-index: 1000;
    }

        #blazor-error-ui .dismiss {
            cursor: pointer;
            position: absolute;
            right: 0.75rem;
            top: 0.5rem;
        }

    .blazor-error-boundary {
        background-color: rgba(255, 255, 255, 0.95);
        border: 2px solid #b32818;
        border-radius: 4px;
        display: block;
        font-family: monospace;
        margin: 1rem;
        overflow: auto;
        padding: 1rem;
    }

        .blazor-error-boundary::after {
            content: "An error has occurred."
        }
</style>
