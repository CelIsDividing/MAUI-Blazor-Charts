<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAUI Blazor Charts - Data Visualization</title>
    <base href="/" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link href="_content/MauiBlazorCharts.Shared/css/app.css" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
      <div
        class="d-flex justify-content-center align-items-center"
        style="height: 100vh"
      >
        <div
          class="spinner-border text-primary"
          role="status"
          style="width: 3rem; height: 3rem"
        >
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>

    <div
      id="blazor-error-ui"
      class="alert alert-warning text-center position-fixed bottom-0 start-0 end-0 m-3 shadow-lg"
      style="display: none; z-index: 1050"
    >
      An error has occurred in the application. Please try refreshing the page.
      <a href="" class="alert-link reload">Reload</a>
      <a
        class="dismiss position-absolute end-0 top-0 m-2 text-decoration-none text-dark"
        style="cursor: pointer"
        >✖</a
      >
    </div>

    <script src="_content/MauiBlazorCharts.Shared/app.js"></script>
    <script src="_framework/blazor.webview.js"></script>
  </body>
</html>
